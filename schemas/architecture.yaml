      parent: Repository Boundaries
      parent_aliases: ["Repository Boundaries (顶层资产与仓库边界)", "Repository Structure"]
      title: Backend Structure
      title_aliases: ["Backend Structure", "后端目录结构"]
      level: 3
      minimum_verified_path_entries: 1
      path_entries_require_responsibility: true
      required_subsections:
