id: security
path: docs/SECURITY.md
applicability: { when_any: [server_api, authentication, external_input, secrets_configuration, sensitive_data], present: recommended, absent: not_applicable }
sections:
  - { id: overview, title: Security Overview, level: 2, required: false, non_empty: true }
  - { id: boundaries, title: Trust Boundaries, level: 2, required: false, non_empty: true }
  - { id: secrets, title: Secrets and Configuration, level: 2, required: false, non_empty: true }
  - { id: risks, title: Known Risks or Limitations, level: 2, required: false, non_empty: true }
  - { id: review, title: Security Review Criteria, level: 2, required: false, non_empty: true }
rules: { section_order: strict, placeholder_forbidden: true }
